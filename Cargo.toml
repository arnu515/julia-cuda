[package]
name = "julia-cuda"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Which PTX tier the binary embeds (src/main.rs); one per build, see the Makefile's ARCH.
# Without any, sm_75, which every GPU we use can JIT-compile.
# rlib for Rust programs (`Engine`), cdylib for the C interface (`capi`).
[lib]
crate-type = ["rlib", "cdylib"]

[features]
sm_75 = []
sm_80 = []
sm_89 = []
sm_120 = []

[dependencies]
# Only the library: the julia-rs binary's `cli` feature isn't needed.
julia-rs = { git = "https://github.com/arnu515/julia-rs", default-features = false }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "f16"] }
half = "2"
memmap2 = "0.9.11"
color-eyre = "0.6.5"
serde_json = "1.0.154"
