[package]
name = "julia-cuda"
version = "0.1.0"
edition = "2024"

# Which PTX tier the binary embeds (src/main.rs); one per build, see the Makefile's ARCH.
# Without any, sm_75, which every GPU we use can JIT-compile.
[features]
sm_75 = []
sm_80 = []
sm_89 = []
sm_120 = []

[dependencies]
julia-rs = { git = "https://github.com/arnu515/julia-rs" }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "f16"] }
half = "2"
color-eyre = "0.6.5"
